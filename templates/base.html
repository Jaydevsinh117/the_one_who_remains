<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}The One Who Remains{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Roboto"', 'sans-serif'],
            shloka: ['"Noto Serif Devanagari"', 'serif']
          },
          colors: {
            'ash-white': '#E6E8EB',
            'stone-grey': '#B8BDC3',
            'void-black': '#0E0F11',
            'muted-celestial': '#5F738A',
          },
        }
      }
    };

  </script>

  <style>
    /* Grain Effect */
    .grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      opacity: 0.05;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Ethereal Monochrome Background */
    body {
        background-color: #E6E8EB;
        color: #0E0F11;
        min-height: 100vh;
    }

    /* Selection Color */
    ::selection {
      background: #5F738A;
      color: #E6E8EB;
    }
  </style>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Noto+Serif+Devanagari&display=swap" rel="stylesheet">

  <!-- Icons -->
  <script src="https://unpkg.com/feather-icons"></script>
</head>

<body
  class="bg-cream text-darkslate dark:bg-cosmic-dark dark:text-starlight font-sans transition-colors duration-300 ease-in-out relative">

  <div class="grain-overlay"></div>

  <!-- 🔱 Navigation Bar -->
  <nav class="p-4 fixed w-full top-0 z-40 bg-ash-white/80 backdrop-blur-md border-b border-stone-grey/20">
    <div class="flex justify-between items-center max-w-7xl mx-auto">
      <a href="/"
        class="text-2xl font-light tracking-wide text-void-black hover:text-muted-celestial transition-colors duration-300">
        One Who Remains
      </a>
      <div class="flex items-center space-x-8 text-sm font-normal text-void-black tracking-widest uppercase">
        <a href="/" class="hover:text-muted-celestial transition-all duration-300">Home</a>
        <a href="/about" class="hover:text-muted-celestial transition-all duration-300">About</a>
        <a href="/deep-dive" class="hover:text-muted-celestial transition-all duration-300">Deep Dive</a>
        <a href="/blog" class="hover:text-muted-celestial transition-all duration-300">Journal</a>
      </div>
    </div>
  </nav>

  <!-- 📖 Main Content -->
  <main class="p-6 pt-32 max-w-5xl mx-auto relative z-10 min-h-screen">
    {% block content %}{% endblock %}
  </main>

  <footer>
    {% block footer %}
    <footer
      class="relative border-t border-stone-grey/20 text-void-black px-6 py-20 overflow-hidden z-10">

      <div class="max-w-4xl mx-auto grid grid-cols-1 sm:grid-cols-2 gap-12 text-left relative z-10">

        <!-- Brand -->
        <div>
          <h2 class="text-xl font-light tracking-widest text-void-black uppercase mb-4">The One Who Remains</h2>
          <p class="text-sm text-stone-grey leading-relaxed max-w-xs">
            Silence is not absence.<br>
            It is presence refined.
          </p>
        </div>

        <!-- Links -->
        <div class="flex flex-col sm:items-end gap-2 text-sm text-stone-grey uppercase tracking-wider">
          <a href="/about" class="hover:text-muted-celestial transition-colors">About</a>
          <a href="/deep-dive" class="hover:text-muted-celestial transition-colors">Deep Dive</a>
          <a href="/blog" class="hover:text-muted-celestial transition-colors">Journal</a>
          <a href="/contact" class="hover:text-muted-celestial transition-colors">Contact</a>
        </div>
      </div>

      <!-- Footer Base -->
      <div class="mt-20 text-center text-xs text-stone-grey tracking-widest relative z-10 uppercase">
        © 2026 One Who Remains
      </div>

      <!-- Font Awesome -->
      <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    </footer>
    {% endblock %}

  </footer>
  <script>
    document.getElementById("newsletter-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = document.getElementById("newsletter-email").value;
      const messageEl = document.getElementById("newsletter-message");

      try {
        const res = await fetch("/subscribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const data = await res.json();
        if (res.ok) {
          messageEl.textContent = data.message;
          messageEl.style.color = "green";
        } else {
          messageEl.textContent = data.error || "Something went wrong.";
          messageEl.style.color = "red";
        }
      } catch (err) {
        messageEl.textContent = "Network error. Please try again.";
        messageEl.style.color = "red";
      }
    });
  </script>

  <script>
    feather.replace();
  </script>
</body>

</html>
