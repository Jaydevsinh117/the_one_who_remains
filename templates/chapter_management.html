<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Chapter | Maha Vishnu Project</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            heading: ['"DM Serif Display"', 'serif'],
            sans: ['"Poppins"', 'sans-serif'],
            shloka: ['"Noto Serif Devanagari"', 'serif']
          },
          colors: {
            vishnublue: '#002366',
            gold: '#f4c430',
            cream: '#f5f5dc',
            sky: '#e8f1f9',
            darkslate: '#1e293b'
          }
        }
      }
    };
  </script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Serif+Devanagari&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
</head>

<body class="bg-cream text-darkslate dark:bg-darkslate dark:text-cream font-sans transition-all duration-300 ease-in-out">

  <!-- 📖 Chapter Form Container -->
  <section class="max-w-3xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-heading text-vishnublue dark:text-gold text-center mb-6">
      Create a New Chapter
    </h1>

    <form id="chapter-form" method="POST" class="bg-white dark:bg-gray-900 p-6 rounded-lg shadow-lg space-y-6 border border-gray-200 dark:border-gray-700">
      <!-- Chapter Title -->
      <div>
        <label for="title" class="block mb-2 font-semibold">Chapter Title:</label>
        <input type="text" id="title" name="title" required
          class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold" />
      </div>

      <!-- Chapter Content -->
      <div>
        <label for="content" class="block mb-2 font-semibold">Content:</label>
        <textarea id="content" name="content" rows="6" required
          class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold resize-y"></textarea>
      </div>

      <!-- Submit -->
      <div class="text-center">
        <button type="submit"
          class="bg-vishnublue hover:bg-gold text-white dark:text-darkslate px-6 py-2 rounded-md transition shadow-md hover:shadow-lg">
          Create Chapter
        </button>
      </div>
    </form>
  </section>

  <!-- ⚙️ Form Submission Script -->
  <script>
    document.getElementById('chapter-form').onsubmit = async function (event) {
      event.preventDefault();

      const data = {
        title: document.getElementById('title').value,
        content: document.getElementById('content').value
      };

      const response = await fetch('/api/chapter', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const result = await response.json();
      if (response.ok) {
        alert('🙏 Chapter created successfully!');
        document.getElementById('chapter-form').reset();
      } else {
        alert('⚠️ Error: ' + result.error);
      }
    };
  </script>
</body>
</html>
