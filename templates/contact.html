{% extends 'base.html' %}

{% block title %}Contact | Maha Vishnu Project{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto py-12 px-6">
  <!-- Heading -->
  <h1 class="text-4xl font-heading text-center text-vishnublue dark:text-gold mb-6">
    Contact Us
  </h1>

  <!-- Subtext -->
  <p class="text-lg text-darkslate dark:text-cream text-center mb-8 font-sans">
    We'd love to hear from you. Whether it's a kind word, a suggestion, or a deep reflection — reach out anytime with devotion and curiosity.
  </p>

  <!-- Contact Form -->
  <form id="contact-form" method="POST" action="/contact" class="bg-white dark:bg-gray-900 shadow-xl rounded-xl p-6 space-y-6 border border-gray-200 dark:border-gray-700">
    
    <!-- Name -->
    <div>
      <label for="name" class="block mb-2 font-medium text-darkslate dark:text-cream">Your Name</label>
      <input type="text" id="name" name="name" required
        class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold transition" />
    </div>

    <!-- Email -->
    <div>
      <label for="email" class="block mb-2 font-medium text-darkslate dark:text-cream">Email Address</label>
      <input type="email" id="email" name="email" required
        class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold transition" />
    </div>

    <!-- Message -->
    <div>
      <label for="message" class="block mb-2 font-medium text-darkslate dark:text-cream">Your Message</label>
      <textarea id="message" name="message" rows="5" required
        class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold transition resize-y"></textarea>
    </div>

    <!-- Submit Button -->
    <div class="text-center">
      <button type="submit"
        class="bg-vishnublue hover:bg-gold text-white dark:text-darkslate px-6 py-2 rounded-md font-semibold shadow-md hover:shadow-lg transition-all duration-200">
        Send Message
      </button>
      <!-- Live Feedback Region -->
      <p id="contact-message" class="mt-4 text-sm font-medium h-6 transition-all duration-300 opacity-0" aria-live="polite"></p>
    </div>
  </form>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('contact-form');
      const messageEl = document.getElementById('contact-message');

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = form.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;

        // TODO: Backend endpoint for /contact is missing.
        // Simulating successful submission for UX demo purposes.
        // Once backend is ready, remove e.preventDefault() or switch to fetch().

        // Loading state
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
        btn.classList.add('opacity-75', 'cursor-not-allowed');

        // Hide previous message
        messageEl.classList.add('opacity-0');
        messageEl.textContent = '';

        // Simulate network delay
        await new Promise(resolve => setTimeout(resolve, 1500));

        // Success state
        btn.innerHTML = 'Message Sent <i class="fas fa-check ml-1"></i>';
        btn.classList.remove('bg-vishnublue', 'hover:bg-gold', 'text-white', 'dark:text-darkslate');
        btn.classList.add('bg-green-600', 'text-white', 'hover:bg-green-700');

        // Show success message
        messageEl.textContent = "Thank you! We've received your message.";
        messageEl.className = "mt-4 text-sm font-medium h-6 transition-all duration-300 opacity-100 text-green-600 dark:text-green-400";

        // Reset form
        form.reset();

        // Restore button after delay
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = originalText;
          btn.classList.remove('opacity-75', 'cursor-not-allowed', 'bg-green-600', 'text-white', 'hover:bg-green-700');
          btn.classList.add('bg-vishnublue', 'hover:bg-gold', 'text-white', 'dark:text-darkslate');

          // Fade out message
          messageEl.classList.add('opacity-0');
        }, 4000);
      });
    });
  </script>
</section>
{% endblock %}
