{% extends 'base.html' %}

{% block title %}Contact | Maha Vishnu Project{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto py-12 px-6">
  <!-- Heading -->
  <h1 class="text-4xl font-heading text-center text-vishnublue dark:text-gold mb-6">
    Contact Us
  </h1>

  <!-- Subtext -->
  <p class="text-lg text-darkslate dark:text-cream text-center mb-8 font-sans">
    We'd love to hear from you. Whether it's a kind word, a suggestion, or a deep reflection — reach out anytime with devotion and curiosity.
  </p>

  <!-- Contact Form -->
  <form id="contact-form" method="POST" action="/contact" class="bg-white dark:bg-gray-900 shadow-xl rounded-xl p-6 space-y-6 border border-gray-200 dark:border-gray-700">
    
    <!-- Name -->
    <div>
      <label for="name" class="block mb-2 font-medium text-darkslate dark:text-cream">Your Name</label>
      <input type="text" id="name" name="name" required
        class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold transition" />
    </div>

    <!-- Email -->
    <div>
      <label for="email" class="block mb-2 font-medium text-darkslate dark:text-cream">Email Address</label>
      <input type="email" id="email" name="email" required
        class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold transition" />
    </div>

    <!-- Message -->
    <div>
      <label for="message" class="block mb-2 font-medium text-darkslate dark:text-cream">Your Message</label>
      <textarea id="message" name="message" rows="5" required
        class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold transition resize-y"></textarea>
    </div>

    <!-- Submit Button -->
    <div class="text-center">
      <button type="submit"
        class="bg-vishnublue hover:bg-gold text-white dark:text-darkslate px-6 py-2 rounded-md font-semibold shadow-md hover:shadow-lg transition-all duration-200">
        Send Message
      </button>
      <p id="form-feedback" class="mt-4 text-sm font-medium min-h-[1.5rem]" aria-live="polite"></p>
    </div>
  </form>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('contact-form');
  const feedback = document.getElementById('form-feedback');

  if (form) {
    form.addEventListener('submit', async (e) => {
      // Prevent default submission because the /contact endpoint only supports GET.
      // Once the backend supports POST, this should be updated to use fetch() or allow default submission.
      e.preventDefault();

      const btn = form.querySelector('button[type="submit"]');
      const originalText = btn.textContent;

      // Loading State
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Sending...';
      feedback.textContent = '';
      feedback.className = "mt-4 text-sm font-medium min-h-[1.5rem] text-darkslate dark:text-cream";

      // Simulate network request (1.5s delay)
      await new Promise(resolve => setTimeout(resolve, 1500));

      // Success State
      btn.innerHTML = '<i class="fas fa-check mr-2"></i>Sent!';
      btn.classList.remove('bg-vishnublue');
      btn.classList.add('bg-green-600', 'text-white');

      feedback.textContent = 'Thank you! Your message has been received.';
      feedback.className = "mt-4 text-sm font-medium min-h-[1.5rem] text-green-600 dark:text-green-400";

      form.reset();

      // Reset Button after 3s
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = originalText;
        btn.classList.remove('bg-green-600', 'text-white');
        btn.classList.add('bg-vishnublue');
        // Clear feedback after a bit longer
        setTimeout(() => {
             feedback.textContent = '';
        }, 2000);
      }, 3000);
    });
  }
});
</script>
{% endblock %}
