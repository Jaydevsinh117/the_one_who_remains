{% extends 'base.html' %}

{% block title %}Contact | Gita Project{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto py-12 px-6">
    <h1 class="text-4xl font-bold mb-6 text-center text-gray-800 dark:text-gray-100">Contact Us</h1>
    
    <p class="text-lg text-gray-700 dark:text-gray-300 mb-8 text-center">
        We'd love to hear from you. Whether it's feedback, suggestions, or just a kind word — reach out anytime.
    </p>

    <form method="POST" action="/contact" class="bg-white dark:bg-gray-900 shadow-md rounded-lg p-6 space-y-6">
        <div>
            <label for="name" class="block mb-1 font-medium text-gray-700 dark:text-gray-300">Name</label>
            <input type="text" id="name" name="name" required
                class="w-full px-4 py-2 border rounded-lg bg-gray-50 dark:bg-gray-800 dark:text-white dark:border-gray-700">
        </div>

        <div>
            <label for="email" class="block mb-1 font-medium text-gray-700 dark:text-gray-300">Email</label>
            <input type="email" id="email" name="email" required
                class="w-full px-4 py-2 border rounded-lg bg-gray-50 dark:bg-gray-800 dark:text-white dark:border-gray-700">
        </div>

        <div>
            <label for="message" class="block mb-1 font-medium text-gray-700 dark:text-gray-300">Message</label>
            <textarea id="message" name="message" rows="5" required
                class="w-full px-4 py-2 border rounded-lg bg-gray-50 dark:bg-gray-800 dark:text-white dark:border-gray-700"></textarea>
        </div>

        <div class="text-center">
            <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2 rounded-lg transition">
                Send Message
            </button>
        </div>
    </form>
</section>
{% endblock %}
