<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Product | Maha Vishnu Project</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            heading: ['"DM Serif Display"', 'serif'],
            sans: ['"Poppins"', 'sans-serif'],
          },
          colors: {
            vishnublue: '#002366',
            gold: '#f4c430',
            cream: '#f5f5dc',
            darkslate: '#1e293b',
          }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
</head>

<body class="bg-cream text-darkslate dark:bg-darkslate dark:text-cream font-sans transition-all duration-300 ease-in-out">

  <!-- Product Form Container -->
  <section class="max-w-3xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-heading text-vishnublue dark:text-gold text-center mb-6">
      Create a New Product
    </h1>

    <form id="product-form" method="POST" class="bg-white dark:bg-gray-900 p-6 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 space-y-6">
      
      <!-- Product Name -->
      <div>
        <label for="name" class="block mb-2 font-medium">Product Name:</label>
        <input type="text" id="name" name="name" required
          class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold" />
      </div>

      <!-- Description -->
      <div>
        <label for="description" class="block mb-2 font-medium">Description:</label>
        <input type="text" id="description" name="description" required
          class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold" />
      </div>

      <!-- Price -->
      <div>
        <label for="price" class="block mb-2 font-medium">Price:</label>
        <input type="number" id="price" name="price" required step="0.01"
          class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold" />
      </div>

      <!-- Submit Button -->
      <div class="text-center">
        <button type="submit"
          class="bg-vishnublue hover:bg-gold text-white dark:text-darkslate px-6 py-2 rounded-md shadow-md hover:shadow-lg transition-all">
          Create Product
        </button>
      </div>
    </form>
  </section>

  <!-- Form Submission Script -->
  <script>
    document.getElementById('product-form').onsubmit = async function(event) {
      event.preventDefault();

      const data = {
        name: document.getElementById('name').value,
        description: document.getElementById('description').value,
        price: parseFloat(document.getElementById('price').value)
      };

      const response = await fetch('/api/product', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const result = await response.json();
      if (response.ok) {
        alert('🙏 Product created successfully!');
        document.getElementById('product-form').reset();
      } else {
        alert('⚠️ Error: ' + result.error);
      }
    };
  </script>
</body>
</html>
