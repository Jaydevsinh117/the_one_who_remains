<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Registration | Maha Vishnu Project</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            heading: ['"DM Serif Display"', 'serif'],
            sans: ['"Poppins"', 'sans-serif']
          },
          colors: {
            vishnublue: '#002366',
            gold: '#f4c430',
            cream: '#f5f5dc',
            darkslate: '#1e293b'
          }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
</head>

<body class="bg-cream text-darkslate dark:bg-darkslate dark:text-cream font-sans transition-all duration-300 ease-in-out">

  <!-- 🕉️ Registration Form -->
  <section class="max-w-md mx-auto px-6 py-12">
    <h1 class="text-3xl font-heading text-vishnublue dark:text-gold text-center mb-6">
      Register a New User
    </h1>

    <form id="register-form" method="POST" class="bg-white dark:bg-gray-900 p-6 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 space-y-6">
      <!-- Username -->
      <div>
        <label for="username" class="block mb-2 font-medium">Username:</label>
        <input type="text" id="username" name="username" required
          class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold transition" />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block mb-2 font-medium">Email:</label>
        <input type="email" id="email" name="email" required
          class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold transition" />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block mb-2 font-medium">Password:</label>
        <input type="password" id="password" name="password" required
          class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold transition" />
      </div>

      <!-- Submit -->
      <div class="text-center">
        <button type="submit"
          class="bg-vishnublue hover:bg-gold text-white dark:text-darkslate px-6 py-2 rounded-md shadow-md hover:shadow-lg transition-all disabled:opacity-75 disabled:cursor-not-allowed flex items-center justify-center gap-2 mx-auto min-w-[120px]">
          Register
        </button>
      </div>

      <!-- Feedback Message -->
      <div id="form-message" class="hidden text-center text-sm font-medium mt-4 p-3 rounded-lg" aria-live="polite"></div>
    </form>
  </section>

  <!-- 🔐 Submission Script -->
  <script>
    document.getElementById('register-form').onsubmit = async function(event) {
      event.preventDefault();

      const form = event.target;
      const btn = form.querySelector('button[type="submit"]');
      const msg = document.getElementById('form-message');

      // Save original button state
      const originalBtnContent = 'Register'; // Since we know the initial text

      // Loading State
      btn.innerHTML = '<svg class="animate-spin h-5 w-5 text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Processing...</span>';
      btn.disabled = true;
      msg.classList.add('hidden');
      msg.className = "hidden text-center text-sm font-medium mt-4 p-3 rounded-lg"; // Reset classes

      const data = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        msg.classList.remove('hidden');

        if (response.ok) {
          msg.textContent = '🪔 Registration successful! Redirecting...';
          msg.classList.add('bg-green-100', 'text-green-800', 'dark:bg-green-900', 'dark:text-green-100');
          form.reset();
          // Redirect after a short delay to let user read the message
          setTimeout(() => window.location.href = '/', 2000);
        } else {
          msg.textContent = '⚠️ ' + (result.error || 'Registration failed.');
          msg.classList.add('bg-red-100', 'text-red-800', 'dark:bg-red-900', 'dark:text-red-100');
          btn.innerHTML = originalBtnContent;
          btn.disabled = false;
        }
      } catch (error) {
        msg.classList.remove('hidden');
        msg.textContent = '⚠️ Network error. Please try again.';
        msg.classList.add('bg-red-100', 'text-red-800', 'dark:bg-red-900', 'dark:text-red-100');
        btn.innerHTML = originalBtnContent;
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
