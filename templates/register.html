<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Registration | Maha Vishnu Project</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            heading: ['"DM Serif Display"', 'serif'],
            sans: ['"Poppins"', 'sans-serif']
          },
          colors: {
            vishnublue: '#002366',
            gold: '#f4c430',
            cream: '#f5f5dc',
            darkslate: '#1e293b'
          }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body class="bg-cream text-darkslate dark:bg-darkslate dark:text-cream font-sans transition-all duration-300 ease-in-out">

  <!-- 🕉️ Registration Form -->
  <section class="max-w-md mx-auto px-6 py-12">
    <h1 class="text-3xl font-heading text-vishnublue dark:text-gold text-center mb-6">
      Register a New User
    </h1>

    <form id="register-form" method="POST" class="bg-white dark:bg-gray-900 p-6 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 space-y-6">
      <!-- Username -->
      <div>
        <label for="username" class="block mb-2 font-medium">Username:</label>
        <input type="text" id="username" name="username" required
          class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold transition" />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block mb-2 font-medium">Email:</label>
        <input type="email" id="email" name="email" required
          class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold transition" />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block mb-2 font-medium">Password:</label>
        <input type="password" id="password" name="password" required
          class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-600 bg-cream dark:bg-darkslate text-darkslate dark:text-cream focus:outline-none focus:ring-2 focus:ring-gold transition" />
      </div>

      <!-- Submit -->
      <div class="text-center space-y-4">
        <button type="submit" id="submit-btn"
          class="bg-vishnublue hover:bg-gold disabled:opacity-70 disabled:cursor-not-allowed text-white dark:text-darkslate px-6 py-2 rounded-md shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 mx-auto min-w-[140px]">
          Register
        </button>
        <!-- Inline Feedback (Accessible) -->
        <div id="register-message" aria-live="polite" class="text-sm font-medium text-center min-h-[1.5rem]"></div>
      </div>
    </form>
  </section>

  <!-- 🔐 Submission Script -->
  <script>
    document.getElementById('register-form').onsubmit = async function(event) {
      event.preventDefault();

      const form = event.target;
      const btn = document.getElementById('submit-btn');
      const messageEl = document.getElementById('register-message');

      const originalBtnContent = btn.innerHTML;

      // 1. Loading State
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';
      messageEl.textContent = '';
      messageEl.className = 'text-sm font-medium text-center min-h-[1.5rem] text-darkslate dark:text-cream';

      const data = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          // 2. Success Feedback
          messageEl.textContent = '🪔 Registration successful!';
          messageEl.className = 'text-sm font-medium text-center min-h-[1.5rem] text-green-600 dark:text-green-400';

          btn.innerHTML = 'Registered <i class="fas fa-check"></i>';
          btn.classList.remove('bg-vishnublue', 'hover:bg-gold');
          btn.classList.add('bg-green-600');

          form.reset();

          // Restore button after delay
          setTimeout(() => {
            btn.innerHTML = originalBtnContent;
            btn.disabled = false;
            btn.classList.remove('bg-green-600');
            btn.classList.add('bg-vishnublue', 'hover:bg-gold');
            messageEl.textContent = ''; // Clear success message too? Maybe keep it.
          }, 3000);

        } else {
          // 3. Error Feedback
          throw new Error(result.error || 'Registration failed');
        }
      } catch (error) {
        messageEl.textContent = '⚠️ ' + error.message;
        messageEl.className = 'text-sm font-medium text-center min-h-[1.5rem] text-red-600 dark:text-red-400';

        // Restore button immediately
        btn.innerHTML = originalBtnContent;
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
